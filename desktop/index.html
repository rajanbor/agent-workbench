<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/open-cube.svg" />
    <title>Open Cube</title>
    <script>
      /* Apply the stored theme before first paint so the shell never flashes. */
      /* Native window: translucent surfaces and room for the traffic lights. */
      if (window.__TAURI_INTERNALS__) document.documentElement.dataset.runtime = "tauri";
      try {
        var stored = localStorage.getItem("open-cube.theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (error) {
        /* storage blocked: fall back to the system theme */
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
