name: Bug report
description: Report a reproducible problem. Report vulnerabilities privately.
body:
  - type: input
    id: version
    attributes:
      label: App version, macOS version and CPU architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected behavior, actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error output
      description: Remove usernames, private paths, tokens, passwords and repository content.
