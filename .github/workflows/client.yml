name: Client

on:
  push:
    paths:
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - ".github/workflows/client.yml"

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p open-cube-core -p open-cube-runtime

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
