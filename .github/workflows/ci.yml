name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: macOS (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Swift and script checks
        run: |
          swift --version
          for script in scripts/*.sh; do bash -n "$script"; done
          bash scripts/setup-macos.sh --dry-run
          bash scripts/install-agent-tools.sh --dry-run
          swift test
      - name: Build app
        run: bash scripts/build-app.sh
      - name: Install and test with a disposable standard account
        env:
          AGENT_WORKBENCH_INTEGRATION: '1'
        run: |
          if id agent >/dev/null 2>&1; then
            echo "Unexpected existing account on CI runner"; exit 1
          fi
          sudo /usr/sbin/sysadminctl -addUser agent -password "$(uuidgen)" -shell /bin/zsh
          bash scripts/install.sh
          printf 'YES\nYES\n' | bash scripts/setup-macos.sh --apply
          printf 'YES\nYES\n' | bash scripts/setup-macos.sh --apply
          swift test
          "$HOME/.local/bin/agentctl" list
      - name: Package
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.runner }}
          path: |
            dist/AgentWorkbench-macos-*.zip
            dist/AgentWorkbench-macos-*.zip.sha256
          retention-days: 14
  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-*
          merge-multiple: true
          path: release-assets
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release-assets && sha256sum -c *.sha256)
          gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/*.sha256 \
            --verify-tag --prerelease --title "Agent Workbench $RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES.md
